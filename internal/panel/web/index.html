          <div class="label-row" style="align-items:center"><div class="label">Set up a tool</div><div class="segmented"><template x-for="t in [['claude','Claude Code'],['codex','Codex'],['other','Other tools']]" :key="t[0]"><button :aria-pressed="dialog.tab === t[0]" @click="dialog.tab = t[0]" x-text="t[1]"></button></template></div></div>
          <div class="label-row" style="align-items:center"><span class="small subtle mono" x-text="snippetPath(dialog.tab)"></span><button class="btn btn-ghost btn-sm" @click="copy(snippet(dialog.tab, dialog.secret), 'the snippet', $el)"><span x-html="icon('copy')"></span>Copy</button></div>
          <pre class="code" x-text="snippet(dialog.tab, dialog.secret)"></pre>
        </div>
        <div class="dialog-foot"><button class="btn btn-ink" @click="closeDialog()">Done</button></div>
      </div></template>

      <!-- Management key created -->
      <!-- Tailnet: one dialog that follows the device's state -->
      <template x-if="dialog.kind === 'tailnet'"><div style="display:flex;flex-direction:column;gap:20px">
        <template x-if="!tailnet || tailnet.state === 'off'"><form style="display:flex;flex-direction:column;gap:20px" @submit.prevent="startTailnet()">
          <div><div class="dialog-head"><h2>Add Mainspring to your tailnet</h2></div><div class="subtle" style="margin-top:4px">It joins as its own device. You sign in to Tailscale next</div></div>
          <div class="field"><label class="label" for="tnname">Device name</label><input id="tnname" class="input" x-model="tn.name" maxlength="63" autocomplete="off" spellcheck="false" x-init="$nextTick(() => $el.focus())">
            <div class="mono small" x-text="'https://' + (tn.name.trim().toLowerCase() || 'mainspring') + '.your-tailnet.ts.net'"></div>
            <div class="help">Lowercase letters, numbers and dashes. Your tailnet's name fills in after you sign in</div></div>
          <template x-if="tn.showKey"><div class="field"><label class="label" for="tnkey">Auth key</label><input id="tnkey" class="input mono" x-model="tn.authKey" placeholder="tskey-auth-…" autocomplete="off" spellcheck="false"><div class="help">From the Keys page in Tailscale's admin console. Mainspring joins without a browser sign-in</div></div></template>
          <template x-if="tn.error"><div class="dialog-error"><span x-html="icon('alert')"></span><div class="subtle" x-text="tn.error"></div></div></template>
          <div class="dialog-foot"><button type="button" class="btn btn-ghost" style="margin-right:auto" @click="tn.showKey = !tn.showKey" x-text="tn.showKey ? 'Sign in with a browser instead' : 'Use an auth key instead'"></button><button type="button" class="btn btn-secondary" @click="closeDialog()">Cancel</button><button class="btn btn-ink" :disabled="tn.busy">Continue</button></div>
        </form></template>

        <template x-if="tailnet && (tailnet.state === 'starting' || tailnet.state === 'needs_login')"><div style="display:flex;flex-direction:column;gap:20px">
          <div><div class="dialog-head"><h2>Sign in to Tailscale</h2></div><div class="subtle" style="margin-top:4px">Use an account on the tailnet you want Mainspring on</div></div>
          <template x-if="tailnet.auth_url"><div class="tn-signin">
            <img class="tn-qr" :src="tailnetQR()" width="144" height="144" alt="QR code for the Tailscale sign-in link">
            <div class="tn-signin-body">
              <div class="tn-qr-hint">Scan it with your phone, or open the link on this computer</div>
              <div><a class="btn btn-ink" :href="tailnet.auth_url" target="_blank" rel="noopener">Open Tailscale sign-in<span x-html="icon('external')"></span></a></div>
              <button class="tn-link" @click="copy(tailnet.auth_url, 'the sign-in link', $el)"><span class="mono" x-text="tailnet.auth_url.replace(/^https:\/\//, '')"></span><span x-html="icon('copy')"></span></button>
            </div></div></template>
          <div class="waiting"><span x-html="SPINNER"></span><span x-text="tailnet.auth_url ? 'Waiting for you to approve Mainspring in Tailscale' : 'Starting Mainspring\'s device'"></span></div>
          <div class="dialog-foot"><button class="btn btn-secondary" @click="cancelTailnet()">Cancel</button></div>
        </div></template>

        <template x-if="tailnet && ['needs_approval', 'certificate', 'no_https', 'failed'].includes(tailnet.state)"><div style="display:flex;flex-direction:column;gap:20px">
          <div><div class="dialog-head"><h2 x-text="tailnet.state === 'no_https' ? 'Turn on HTTPS for your tailnet' : tailnet.state === 'needs_approval' ? 'Waiting for an admin' : tailnet.state === 'failed' ? 'Couldn\'t add Mainspring' : 'Connecting'"></h2></div>
            <div class="subtle" style="margin-top:4px" x-text="tailnet.state === 'no_https' ? 'Mainspring joined, but ' + tailnet.tailnet + ' doesn\'t hand out HTTPS certificates yet' : tailnet.state === 'needs_approval' ? 'A tailnet admin needs to approve the device in Tailscale\'s admin console' : tailnet.state === 'failed' ? tailnet.error : 'You can close this. Mainspring keeps going and Settings shows when it\'s done'"></div></div>
          <template x-if="tailnet.state === 'certificate' || tailnet.state === 'no_https'"><div class="tn-steps">
            <div class="tn-step"><span class="tn-done" x-html="icon('check')"></span><div><div class="strong">Signed in to Tailscale</div><div class="small subtle">Tailnet <span class="mono" x-text="tailnet.tailnet"></span><span x-show="tailnet.user" x-text="', as ' + tailnet.user"></span></div></div></div>
            <div class="tn-step"><span class="tn-done" x-html="icon('check')"></span><div><div class="strong" x-text="'Joined as ' + tailnet.hostname"></div><div class="small subtle"><span class="mono" x-text="tailnet.ip"></span> on your tailnet</div></div></div>
            <template x-if="tailnet.state === 'certificate'"><div class="tn-step"><span x-html="SPINNER"></span><div><div class="strong">Getting an HTTPS certificate</div><div class="small subtle" x-text="tailnet.error || ('For ' + tailnet.dns_name + ', through Tailscale. This can take a minute')"></div></div></div></template>
            <template x-if="tailnet.state === 'no_https'"><div class="tn-step"><span x-html="icon('info')"></span><div style="display:flex;flex-direction:column;gap:10px"><div><div class="strong">HTTPS is off for this tailnet</div><div class="small subtle">In Tailscale's admin console, open DNS and choose Enable HTTPS. Security keys only work over HTTPS</div></div><div><a class="btn btn-secondary btn-sm" href="https://login.tailscale.com/admin/dns" target="_blank" rel="noopener">Open DNS settings<span x-html="icon('external')"></span></a></div></div></div></template>
          </div></template>
          <template x-if="tailnet.state === 'no_https'"><div class="small subtle">Until then, tools can use <span class="mono" x-text="tailnet.url + '/v1'"></span></div></template>
          <div class="dialog-foot">
            <template x-if="tailnet.state === 'failed'"><button class="btn btn-secondary" @click="removeTailnet()">Start over</button></template>
            <button class="btn btn-secondary" @click="closeDialog()">Close</button>
            <template x-if="tailnet.state === 'no_https'"><button class="btn btn-ink" :disabled="tn.busy" @click="checkTailnet()">Check again</button></template>
          </div>
        </div></template>

        <template x-if="tailnet && tailnet.state === 'connected'"><div style="display:flex;flex-direction:column;gap:20px">
          <div><div class="dialog-head"><h2>Mainspring is on your tailnet</h2></div><div class="subtle" style="margin-top:4px" x-text="'Every device on ' + tailnet.tailnet + ' can reach it, with HTTPS'"></div></div>
          <div class="tn-address"><div class="row"><span class="mono" x-text="tailnet.url"></span><button class="btn btn-secondary btn-sm" @click="copy(tailnet.url, 'the address', $el)"><span x-html="icon('copy')"></span>Copy</button></div>
            <div class="small subtle">Tools use <span class="mono" x-text="tailnet.url + '/v1'"></span> with a Mainspring key</div></div>
          <div class="notice"><span x-html="icon('lock')"></span><div class="body" x-text="tailnet.keys ? 'This address skips Umbrel\'s login, so the panel there asks for your security key' : 'This address skips Umbrel\'s login, so the panel there needs a security key. Open it to add one'"></div></div>
          <div class="dialog-foot"><button class="btn btn-secondary" @click="closeDialog()">Done</button><button class="btn btn-ink" @click="openTailnetAddress()">Open it<span x-html="icon('external')"></span></button></div>
        </div></template>
      </div></template>

      <!-- What's new, and the update when one is out -->
      <template x-if="dialog.kind === 'whatsnew'"><div style="display:flex;flex-direction:column;gap:20px">
        <div class="dialog-head"><h2>What's new</h2><button class="btn-icon" @click="closeDialog()" x-html="icon('close')" aria-label="Close"></button></div>
        <div class="versions" x-show="updates && updates.current">
          <div><div class="small subtle">Installed</div><div class="mono strong" x-text="updates && updates.current"></div></div>
          <div><div class="small subtle">Latest</div><div class="mono strong" x-text="updates && (updates.latest_version || (updates.checked_at ? updates.current : '—'))"></div></div>
          <div class="versions-state small" :class="updates && updates.available ? 'strong' : 'subtle'" x-text="!updates ? '' : updates.available ? 'Update available' : updates.checked_at ? 'Up to date · checked ' + fmt.ago(updates.checked_at, now) : updates.enabled ? 'Not checked yet' : 'Update checks are off'"></div>
        </div>
        <template x-if="updates && updates.available"><div class="card whatsnew-update">
          <div class="strong" x-text="'Mainspring ' + updates.latest.version + ' is out'"></div>
          <ul class="notes"><template x-for="n in noteItems(updates.latest.notes)" :key="n"><li x-html="md(n)"></li></template></ul>
          <div class="subtle" x-text="updateSteps().text"></div>
          <template x-if="updateSteps().cmd"><div class="secret"><span class="mono" x-text="updateSteps().cmd"></span><button class="btn btn-secondary btn-sm" @click="copy(updateSteps().cmd, 'the command', $el)"><span x-html="icon('copy')"></span>Copy</button></div></template>
          <div><a class="btn btn-ghost btn-sm" :href="updates.latest.url" target="_blank" rel="noopener">Release on GitHub<span x-html="icon('external')"></span></a></div>
        </div></template>
        <div class="whatsnew-list">
          <template x-if="!changelog"><div class="subtle">Loading…</div></template>
          <template x-if="changelog && changelog.error"><div class="subtle" x-text="changelog.error"></div></template>
          <template x-for="r in (changelog ? changelog.releases : [])" :key="r.version"><section>
            <div class="whatsnew-head"><span class="strong mono" x-text="r.version"></span><template x-if="changelog.current === r.version"><span class="badge">This version</span></template><span class="meta grow" style="text-align:right" x-text="r.date ? fmt.day(Date.parse(r.date)) : ''"></span></div>
            <ul class="notes"><template x-for="n in r.items" :key="n"><li x-html="md(n)"></li></template></ul>
          </section></template>
        </div>
      </div></template>

      <template x-if="dialog.kind === 'hubkey'"><div style="display:flex;flex-direction:column;gap:20px">
        <div><div class="dialog-head"><h2>Management key</h2></div><div class="subtle">In T3 Code, open Settings → Providers → Usage providers → Add hub, then paste the address and this key</div></div>
        <div class="field"><div class="label">Hub URL</div><div class="secret"><span class="mono" x-text="location.origin"></span><button class="btn btn-secondary btn-sm" @click="copy(location.origin, 'the address', $el)"><span x-html="icon('copy')"></span>Copy</button></div></div>
        <div class="field"><div class="label">Key</div><div class="secret"><span class="mono" x-text="dialog.secret"></span><button class="btn btn-secondary btn-sm" @click="copy(dialog.secret, 'the key', $el)"><span x-html="icon('copy')"></span>Copy</button></div><div class="help">Copy it now. Mainspring won't show it again. It reads limits and can clear a cooldown or spend a Codex reset credit, but never sends prompts</div></div>
        <div class="dialog-foot"><button class="btn btn-ink" @click="closeDialog()">Done</button></div>
      </div></template>

      <!-- Add sign-in key -->
      <template x-if="dialog.kind === 'addkey'"><form style="display:flex;flex-direction:column;gap:20px" @submit.prevent="submitSignInKey()">
        <div><div class="dialog-head"><h2 x-text="dialog.keyKind === 'passkey' ? 'Add passkey' : 'Add security key'"></h2></div><div class="subtle" style="margin-top:4px" x-text="dialog.keyKind === 'passkey' ? 'Your browser asks how to save it' : 'Your browser may ask for the key\'s PIN first'"></div></div>
        <div class="field"><label class="label" for="skn">Name</label><input id="skn" class="input" x-model="dialog.name" :placeholder="dialog.keyKind === 'passkey' ? 'MacBook Touch ID' : 'YubiKey 5C NFC, travel'" x-init="$nextTick(() => $el.focus())" maxlength="64"></div>
        <template x-if="dialog.waiting"><div class="waiting"><span x-html="SPINNER"></span><span x-text="dialog.keyKind === 'passkey' ? 'Confirm the passkey in your browser' : 'Insert your key and touch it when it blinks'"></span></div></template>
        <div class="help" x-text="dialog.keyKind === 'passkey' ? 'Your browser or phone stores the passkey' : 'Added without a passkey, so it doesn\'t use one of the key\'s passkey slots'"></div>
        <template x-if="dialog.error"><div class="dialog-error" x-text="dialog.error"></div></template>
        <div class="dialog-foot"><button type="button" class="btn btn-secondary" @click="closeDialog()">Cancel</button><button class="btn btn-ink" :disabled="dialog.waiting || !dialog.name.trim()">Add key</button></div>
      </form></template>

    </div>
  </div>
</template>

</div>
</body>
</html>
